<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Administração de Profissionais</title>
    <link rel="stylesheet" href="assets/css/paginas/admin-profissionais.css" />
  </head>

  <body>
    <header class="header">
      <a href="index.html" class="logo">PetShow</a>

      <nav class="nav">
        <a href="index.html">Página Inicial</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html">Cadastro</a>
      </nav>
    </header>

    <main class="container">
      <section class="card-cadastro">
        <h1>Cadastro de Profissional</h1>

        <form class="form-cadastro">
          <div class="campo">
            <label for="usuario">Usuário</label>

            <select id="usuario" required>
              <option value="">Selecione o usuário</option>
            </select>
          </div>

          <div class="campo">
            <label for="especialidade">Especialidade</label>

            <select id="especialidade" required>
              <option value="">Selecione a especialidade</option>
            </select>
          </div>

          <div class="campo">
            <label for="status">Status</label>

            <select id="status" required>
              <option value="ATIVO">Ativo</option>
              <option value="INATIVO">Inativo</option>
            </select>
          </div>

          <button type="submit" class="btn-confirm">
            Cadastrar
          </button>
        </form>
      </section>

      <section class="card-profissionais">
        <h1>Profissionais Cadastrados</h1>

        <div class="tabela-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Especialidade</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>

            <tbody id="tabela-profissionais">
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="modal-edicao" class="modal">
      <div class="modal-conteudo">
        <h2>Editar Profissional</h2>

        <form id="form-edicao">
          <input type="hidden" id="editar-id" />

          <div class="campo">
            <label for="editar-usuario">Usuário</label>

            <select id="editar-usuario" required>
              <option value="">Selecione o usuário</option>
            </select>
          </div>

          <div class="campo">
            <label for="editar-especialidade">Especialidade</label>

            <select id="editar-especialidade" required>
              <option value="">Selecione a especialidade</option>
            </select>
          </div>

          <div class="campo">
            <label for="editar-status">Status</label>

            <select id="editar-status" required>
              <option value="ATIVO">Ativo</option>
              <option value="INATIVO">Inativo</option>
            </select>
          </div>

          <div class="modal-acoes">
            <button type="submit" class="btn-confirm">
              Salvar
            </button>

            <button
              type="button"
              class="btn-cancelar"
              id="btn-cancelar"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">
      <p>© 2026 PetShow - Sistema de Agendamento</p>
    </footer>

    <script
      type="module"
      src="./assets/js/paginas/admin-profissionais.js"
    ></script>
  </body>
</html>
