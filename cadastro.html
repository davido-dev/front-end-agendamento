<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="assets/css/paginas/cadastro.css" />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo"> PetShow </a>

      <nav class="nav">
        <a href="index.html">Página Inicial</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html">Cadastro</a>
      </nav>
    </header>
    <main class="container">
      <section class="card-cadastro">
        <h1>Cadastro de Usuário</h1>

        <form>
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" />
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>

            <input type="text" id="telefone" maxlength="15" placeholder="(11) 99999-9999" />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" />
          </div>

          <div class="campo">
            <label for="senha">Confirme a Senha</label>
            <input type="password" id="confirmeSenha" placeholder="Confirme a Senha" />
          </div>

          <button type="submit" class="btn-confirm">Cadastrar</button>
        </form>
      </section>
    </main>
    <script type="module" src="./assets/js/paginas/cadastro.js"></script>
    <footer class="footer">
      <p>© 2026 PetShow - Sistema de Agendamento</p>
    </footer>
  </body>
</html>
