<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/paginas/perfil-usuario.css">
    <title>Meu Perfil</title>
  </head>

  <body>
    <header class="header">
      <a href="index.html" class="logo">PetShow</a>

      <nav class="nav">
        <a href="index.html">Página Inicial</a>
        <a href="perfil-usuario.html">Meu Perfil</a>
        <a href="login.html">Sair</a>
      </nav>
    </header>

    <main class="container">
      <section class="card-perfil">
        <h1>Meu Perfil</h1>

        <form>
          <div class="campo">
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              placeholder="Digite seu nome"
              maxlength="100"
              required
            />
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input
              type="text"
              id="cpf"
              placeholder="CPF"
              disabled
            />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              maxlength="100"
              required
            />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              placeholder="Digite seu telefone"
              maxlength="20"
            />
          </div>

          <div class="campo">
            <label for="senha">Nova senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Digite uma nova senha"
            />
          </div>

          <div class="campo">
            <label for="confirmeSenha">Confirmar nova senha</label>
            <input
              type="password"
              id="confirmeSenha"
              placeholder="Confirme a nova senha"
            />
          </div>

          <button class="btn-confirm" type="submit">
            Atualizar dados
          </button>

          <p class="link">
            <a href="index.html">Voltar para a página inicial</a>
          </p>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 PetShow - Sistema de Agendamento</p>
    </footer>

    <script type="module" src="./assets/js/paginas/perfil-usuario.js"></script>
  </body>
</html>
