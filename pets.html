<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastrar Pet - PetShow</title>

    <link rel="stylesheet" href="assets/css/paginas/pets.css" />
  </head>

  <body>
    <!-- Cabeçalho -->
    <header class="header">
      <a href="index.html" class="logo">PetShow</a>

      <nav class="nav">
        <a href="index.html">Página Inicial</a>
        <a href="perfil-usuario.html">Meu Perfil</a>
        <a href="pets.html">Meus Pets</a>
        <a href="agendamentos-usuario.html">Meus Agendamentos</a>
        <a href="agendamentos.html">Agendar Serviço</a>
        <a id="btn-sair">Sair</a>
      </nav>
    </header>

    <main class="container">
      <section class="card-cadastro-pet">
        <h1>Cadastrar Pet</h1>

        <p class="descricao">Preencha os dados do seu pet para poder agendar serviços para ele.</p>

        <form id="form-cadastro-pet">
          <!-- Nome -->
          <div class="campo">
            <label for="nome">Nome do pet</label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex: Rex"
              maxlength="100"
              required
            />
          </div>

          <!-- Tipo -->
          <div class="campo">
            <label for="tipo">Tipo</label>

            <select id="tipo" name="tipo" required>
              <option value="">Selecione o tipo</option>
              <option value="Cachorro">Cachorro</option>
              <option value="Gato">Gato</option>
              <option value="Ave">Ave</option>
              <option value="Roedor">Roedor</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <!-- Raça -->
          <div class="campo">
            <label for="raca">Raça</label>

            <input
              type="text"
              id="raca"
              name="raca"
              placeholder="Ex: Labrador"
              maxlength="50"
              required
            />
          </div>

          <!-- Idade -->
          <div class="campo">
            <label for="idade">Idade (anos)</label>

            <input
              type="number"
              id="idade"
              name="idade"
              min="0"
              max="40"
              placeholder="Ex: 3"
              required
            />
          </div>

          <button type="submit" id="btn-cadastrar-pet" class="btn-confirm">Cadastrar Pet</button>
        </form>
      </section>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
      <p>© 2026 PetShow - Sistema de Agendamento</p>
    </footer>

    <script type="module" src="./assets/js/paginas/pets.js"></script>
    <script type="module" src="assets/js/componentes/logout.js"></script>
  </body>
</html>
